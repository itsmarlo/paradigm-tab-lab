name: Validate benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-experiment.txt
      - run: python -m pip install -r requirements-experiment.txt
      - run: python scripts/validate_published_experiment.py
      - run: python scripts/validate_context_benchmark.py
      - run: python -m pytest -q tests/
      - name: Execute the three original-data notebooks
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/run_original_context_comparison.py
          test "$(find notebooks -name '*.ipynb' | wc -l)" -eq 3
          for notebook in notebooks/01_before_context_engineering.ipynb notebooks/02_in_context_changes.ipynb notebooks/03_after_context_engineering.ipynb; do
            python -m jupyter nbconvert --execute --to notebook --stdout "$notebook" > /dev/null
          done
