name: Publish Paradigm Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-experiment.txt
      - run: python -m pip install -r requirements-experiment.txt
      - run: python scripts/validate_published_experiment.py
      - name: Execute the saved comparison notebook
        env:
          MPLBACKEND: Agg
        run: python -m jupyter nbconvert --execute --to notebook --stdout notebooks/compare_saved_results.ipynb > /dev/null

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Type check and build the app
        run: npm run build -- --base=/paradigm-tab-lab/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  publish:
    if: github.event_name != 'pull_request'
    needs: [build, experiment]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
